openapi: 3.0.1
info:
  title: Swagger TheMealBD
  description: |-
    Ceci est une spécification crée à partir des endpoints de l'API TheMealDB
  contact:
    email: fguibon@oxyl.fr
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: https://www.themealdb.com/api/json/v1/1
tags:
  - name: Filter
    description: Filter meals by attribute
  - name: Search
    description: Search meals
  - name: Lookup
    description: Lookup a meal
  - name: List
    description: List categories, areas and ingredients
paths:
  /filter.php:
    get:
      tags:
        - Filter
      summary: Filter meals by ingredient, category or area
      operationId: filter
      parameters:
        - name: i
          in: query
          description: Main ingredient name
          required: true
          schema:
            type: string
            default: chicken
        - name: c
          in: query
          description: Category
          required: false
          schema:
            type: string
        - name: a
          in: query
          description: Area
          required: false
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealList'
        '400':
          description: Invalid ingredient value
  /search.php:
    get:
      tags:
        - Search
      summary: Search meals by first letter or name
      operationId: search
      parameters:
        - name: f
          in: query
          description: First letter of meal
          required: true
          schema:
            type: string
            default: a
        - name: s
          in: query
          description: Search by name of meal
          required: false
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealDetailed'
        '400':
          description: Invalid name
  /lookup.php:
    get:
      tags:
        - Lookup
      summary: Lookup meal by its id
      operationId: lookupById
      parameters:
        - name: i
          in: query
          description: Id of meal
          required: true
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealDetailed'
        '400':
          description: Invalid id
  /random.php:
    get:
      tags:
        - Lookup
      summary: Lookup random meal
      operationId: random
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealDetailed'
        '400':
          description: Invalid id
  /categories.php:
    get:
      tags:
        - List
      summary: List categories with details
      operationId: categoriesDetailed
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDetailedList'
        '400':
          description: Invalid id
  /list.php:
    get:
      tags:
        - List
      summary: List ingredient, category or area
      operationId: listComponents
      parameters:
        - name: i
          in: query
          description: List ingredients
          required: true
          schema:
            type: string
            default: list
        - name: c
          in: query
          description: List categories
          required: false
          schema:
            type: string
            default: list
        - name: a
          in: query
          description: List areas
          required: false
          schema:
            type: string
            default: list
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: '#/components/schemas/MealComponentList'
        '400':
          description: Invalid ingredient value
components:
  schemas:
    Meal:
